name = "what-tesla-saw-lean"
version = "1.0.0"
defaultTargets = ["WhatTeslaSaw", "TeslaCore_v3"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# The real-number library: Tesla's laws and numbers, stated over ℝ with every hypothesis.
[[lean_lib]]
name = "WhatTeslaSaw"

# The file printed in the paper's Evidence section, byte-identical (see PROVENANCE.md).
# Core Lean only; statements over ℕ and ℤ with quantities scaled to whole units.
[[lean_lib]]
name = "TeslaCore_v3"
